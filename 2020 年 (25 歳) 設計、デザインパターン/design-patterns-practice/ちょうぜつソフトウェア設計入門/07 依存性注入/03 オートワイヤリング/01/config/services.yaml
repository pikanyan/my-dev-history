services:
    _defaults:
        autowrite: true

    FizzBuzz\:
        resource: '../src/*'
        
    FizzBuzz\App\FizzBuzzSequencePrinter:
        public: true
        # constructor が求める型が
        # arguments:
            # $fizzBuzz: '@FizzBuzz\Core\NumberConverter'
            # $output: '@FizzBuzz\App\OutputInterface'

    FizzBuzz\Core\NumberConverter:
        arguments:
            $rules:
                - "@fizzbuzz.rule.fizz"
                - "@fizzbuzz.rule.buzz"
                - "@FizzBuzz\Spec\PassThroughRule"

    fizzbuzz.rule.fizz:
        class: FizzBuzz\Spec\CyclicNumberRule
        arguments: [3, 'Fizz']

    fizzbuzz.rule.buzz:
        class: FizzBuzz\Spec\CyclicNumberRule
        arguments: [5, 'Buzz']

    # constructor 引数がない class は
    # new するだけということが自明
    # FizzBuzz\Spec\PassThroughRule: ~

    # interface を実装する class が単数
    # FizzBuzz\App\OutputInterface:
        # class: FizzBuzz\ConsoleOutput
